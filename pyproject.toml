[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtoc-py"
version = "0.1.0"
description = "Generate a table of contents for Markdown files, in place or to stdout."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adrian Delacruz" }]

[project.scripts]
mdtoc = "mdtoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
